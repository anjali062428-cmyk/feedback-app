<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback Form</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --border-focus: #3b82f6;
            --ring: rgba(59, 130, 246, 0.2);
            --star-active: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            width: 100%;
            max-width: 580px;
            padding: 2.5rem;
        }

        .header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.35rem;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.45rem;
            color: var(--text);
        }

        .required {
            color: #ef4444;
            margin-left: 2px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            color: var(--text);
            background-color: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--ring);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        /* Rating styles */
        .rating-options {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.25rem;
        }

        .rating-option {
            flex: 1;
            position: relative;
        }

        .rating-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .rating-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 0.25rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 0.95rem;
            font-weight: 600;
            user-select: none;
        }

        .rating-option input[type="radio"]:checked + .rating-label {
            background-color: #eff6ff;
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 0 2px var(--ring);
        }

        .rating-label span.star {
            color: var(--star-active);
            font-size: 1.1rem;
            line-height: 1;
            margin-bottom: 0.15rem;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 0.875rem 1.5rem;
            margin-top: 1.75rem;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.05s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>We Value Your Feedback</h1>
            <p>Please help us improve by sharing your thoughts and experience.</p>
        </header>

        <form action="/submit" method="POST">
            <!-- Name Field -->
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
            </div>

            <!-- Category Field -->
            <div class="form-group">
                <label for="category">Category <span class="required">*</span></label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="Product Feedback">Product Feedback</option>
                    <option value="Bug Report">Bug Report</option>
                    <option value="Feature Request">Feature Request</option>
                    <option value="Customer Support">Customer Support</option>
                    <option value="General Inquiry">General Inquiry</option>
                </select>
            </div>

            <!-- Rating Field -->
            <div class="form-group">
                <label>Rating <span class="required">*</span></label>
                <div class="rating-options">
                    <div class="rating-option">
                        <input type="radio" id="rating-1" name="rating" value="1" required>
                        <label class="rating-label" for="rating-1">
                            <span class="star">&#9733;</span>
                            <span>1</span>
                        </label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating-2" name="rating" value="2">
                        <label class="rating-label" for="rating-2">
                            <span class="star">&#9733;</span>
                            <span>2</span>
                        </label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating-3" name="rating" value="3">
                        <label class="rating-label" for="rating-3">
                            <span class="star">&#9733;</span>
                            <span>3</span>
                        </label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating-4" name="rating" value="4">
                        <label class="rating-label" for="rating-4">
                            <span class="star">&#9733;</span>
                            <span>4</span>
                        </label>
                    </div>
                    <div class="rating-option">
                        <input type="radio" id="rating-5" name="rating" value="5">
                        <label class="rating-label" for="rating-5">
                            <span class="star">&#9733;</span>
                            <span>5</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Comments Field -->
            <div class="form-group">
                <label for="comments">Comments <span class="required">*</span></label>
                <textarea id="comments" name="comments" placeholder="Describe your experience or suggestions in detail..." required></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Submit Feedback</button>
        </form>
    </div>
</body>
</html>
